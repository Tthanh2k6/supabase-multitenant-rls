name: CI
on:
  push:
  pull_request:

jobs:
  isolation-tests:
    name: Tenant isolation tests on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ["15", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  rls-lint:
    name: supabase-rls-check on the migrated schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Supabase stub and migrations
        run: |
          which psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
          psql -h 127.0.0.1 -U postgres -d app -v ON_ERROR_STOP=1 -f tests/supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -h 127.0.0.1 -U postgres -d app -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Lint RLS (fail on Low and above)
        uses: Tthanh2k6/supabase-rls-check@v0.2.2
        with:
          database-url: postgresql://postgres@127.0.0.1:5432/app
          i-own-this-project: "true"
          fail-on: Low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rls-report
          path: rls-report/
